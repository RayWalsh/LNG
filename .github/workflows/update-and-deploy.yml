name: Update Panama Canal data and deploy dashboard

on:
  schedule:
    # Every 6 hours. Adjust to taste — Vortexa data doesn't need
    # minute-by-minute refreshes for a wait-time dashboard.
    - cron: "0 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "site/**"
      - ".github/workflows/update-and-deploy.yml"
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest Panama Canal wait-time data
        env:
          VORTEXA_API_KEY: ${{ secrets.VORTEXA_API_KEY }}
        run: python3 scripts/fetch_panama_wait_times.py

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
