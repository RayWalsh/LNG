name: Probe Turkish Straits data sources

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-turkish-straits.yml"

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install vortexasdk packaging pandas requests beautifulsoup4 lxml

      - name: Probe Vortexa Turkish Straits coverage
        env:
          VORTEXA_API_KEY: ${{ secrets.VORTEXA_API_KEY }}
        run: python3 scripts/probe_turkish_straits_vortexa.py

      - name: Probe KEGM vessel traffic
        run: python3 scripts/probe_turkish_straits_kegm.py

      - name: Upload KEGM diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turkish-straits-kegm-probe
          path: artifacts/turkish_straits_kegm_probe.json
          if-no-files-found: warn
