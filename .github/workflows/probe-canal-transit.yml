name: Probe Canal Transit endpoint

# Manual-only diagnostic. Confirms:
#   1. CanalTransit is a real importable class in the installed SDK
#   2. What filter arguments its .search() method actually accepts
#   3. What a real (small, 7-day) pull of Panama data actually looks like
# Delete this file once the real pipeline is confirmed working.

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install vortexasdk packaging pandas

      - name: List available endpoint classes
        run: |
          python -c "
          import vortexasdk
          names = [n for n in dir(vortexasdk) if not n.startswith('_')]
          print('Available in vortexasdk:')
          for n in sorted(names):
              print(' -', n)
          "

      - name: Confirm CanalTransit and inspect its search() signature
        run: |
          python -c "
          from vortexasdk import CanalTransit
          import inspect
          print('CanalTransit imported OK')
          print()
          print('search() signature:')
          print(inspect.signature(CanalTransit().search))
          print()
          print('search() docstring:')
          print(CanalTransit().search.__doc__)
          "

      - name: Small real pull — last 30 days, Panama only, print shape
        env:
          VORTEXA_API_KEY: ${{ secrets.VORTEXA_API_KEY }}
        run: |
          python -c "
          from datetime import datetime, timedelta
          from vortexasdk import CanalTransit

          time_max = datetime.utcnow()
          time_min = time_max - timedelta(days=30)

          result = CanalTransit().search(
              filter_canal='panama_canal',
              filter_queue_arrival_time_min=time_min,
              filter_queue_arrival_time_max=time_max,
          )
          df = result.to_df()

          print('Rows returned:', len(df))
          print()
          print('Columns:', list(df.columns))
          print()
          if len(df):
              print('First row:')
              print(df.iloc[0])
              print()
              if 'vessel_dead_weight' in df.columns:
                  print('vessel_dead_weight — min/max/count non-null:')
                  print(df['vessel_dead_weight'].min(), df['vessel_dead_weight'].max(), df['vessel_dead_weight'].notna().sum())
          "

      - name: Probe the two target DWT bands specifically
        env:
          VORTEXA_API_KEY: ${{ secrets.VORTEXA_API_KEY }}
        run: |
          python -c "
          from datetime import datetime, timedelta
          from vortexasdk import CanalTransit

          time_max = datetime.utcnow()
          time_min = time_max - timedelta(days=180)

          bands = {
              '88k DWT band (86000-90000)': (86000, 90000),
              '95k DWT band (93000-97000)': (93000, 97000),
          }

          for label, (dwt_min, dwt_max) in bands.items():
              result = CanalTransit().search(
                  filter_canal='panama_canal',
                  filter_vessel_dead_weight_min=dwt_min,
                  filter_vessel_dead_weight_max=dwt_max,
                  filter_queue_arrival_time_min=time_min,
                  filter_queue_arrival_time_max=time_max,
              )
              df = result.to_df()
              print(f'{label}: {len(df)} rows in the last 180 days')
              if len(df):
                  cols = [c for c in ['vessel_name','vessel_dead_weight','direction','lock','queue_arrival_time','canal_entry_time'] if c in df.columns]
                  print(df[cols].head(5).to_string())
              print()
          "
