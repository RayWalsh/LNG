name: Probe ACP auction portal

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Inspect authenticated downloads page
        env:
          ACP_AUCTION_EMAIL: ${{ secrets.ACP_AUCTION_EMAIL }}
          ACP_AUCTION_PASSWORD: ${{ secrets.ACP_AUCTION_PASSWORD }}
        run: python scripts/probe_auction_portal.py
