name: Probe Balboa and Cristobal

# Manual-only diagnostic. Checks whether Balboa and Cristobal (the
# actual Panama Canal entry/exit anchorages) exist as distinct
# Geographies, and whether real per-voyage arrival/departure data is
# available at those specific locations.

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install vortexasdk packaging pandas

      - name: Run Balboa/Cristobal probe
        env:
          VORTEXA_API_KEY: ${{ secrets.VORTEXA_API_KEY }}
        run: python3 scripts/probe_balboa_cristobal.py
